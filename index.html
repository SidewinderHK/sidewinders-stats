<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Season Statistics</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Match Statistics</h1>
      <div class="controls">
        <label for="seasonSelect">Select Season:</label>
        <select id="seasonSelect">
          <option value="">Loading seasons...</option>
        </select>
      </div>
    </header>

    <main>
      <div id="tableContainer">
        <table id="statsTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Opponent</th>
              <th>Result</th>
              <th>Score</th>
              <th>Goals</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="5" class="status-msg">Loading data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
